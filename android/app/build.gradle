plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mx5.dashboard'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mx5.dashboard'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/diagnosticAssets')
}

tasks.register('copyDiagnosticCatalog', Copy) {
    from rootProject.file('../default.json')
    from rootProject.file('../discovered_obd.json')
    into layout.buildDirectory.dir('generated/diagnosticAssets')
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('copyDiagnosticCatalog')
}

dependencies {
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    implementation 'androidx.car.app:app:1.4.0'
}